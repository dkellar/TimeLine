<title>Runway Arrows</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
  :root {
    --ground: #F3ECDC;
    --rule: #E1D6C0;
    --text: #4A3320;
    --muted: #9A8468;
    --line: #6F4A2E;
    --accent: #D98A3A;
    --life: #4DA3F5;
    --life-empty: #D9CEB9;
    --overlay: rgba(243, 236, 220, 0.9);
    --btn: #6F4A2E;
    --btn-text: #F8F2E6;
    --display: "Fredoka", "Arial Rounded MT Bold", "Helvetica Neue", sans-serif;
    --body: "Nunito", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #201B16;
      --rule: #34302A;
      --text: #F0E4D0;
      --muted: #9C8C74;
      --line: #E7CBA4;
      --accent: #F0A24E;
      --life: #5FAEF8;
      --life-empty: #3E372E;
      --overlay: rgba(32, 27, 22, 0.9);
      --btn: #E7CBA4;
      --btn-text: #201B16;
    }
  }
  :root[data-theme="dark"] {
    --ground: #201B16;
    --rule: #34302A;
    --text: #F0E4D0;
    --muted: #9C8C74;
    --line: #E7CBA4;
    --accent: #F0A24E;
    --life: #5FAEF8;
    --life-empty: #3E372E;
    --overlay: rgba(32, 27, 22, 0.9);
    --btn: #E7CBA4;
    --btn-text: #201B16;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* Each bow lost pushes the ground a step deeper into red: 0, 1, 2 bows gone. */
  :root { --lost: 0; }
  :root[data-lost="1"] { --lost: 1; }
  :root[data-lost="2"] { --lost: 2; }
  :root[data-lost="3"] { --lost: 3; }
  body {
    margin: 0;
    background: var(--ground);
    background: color-mix(in srgb, var(--ground) calc(100% - var(--lost) * 30%), #B8382A);
    transition: background 500ms ease;
    color: var(--text);
    font-family: var(--body);
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .app {
    width: min(100%, 720px);
    margin: 0 auto;
    padding: env(safe-area-inset-top) 16px max(20px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  .topbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 18px 0 14px;
    border-bottom: 2px solid var(--rule);
  }
  .topbar h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(22px, 5vw, 30px);
    color: var(--accent);
    margin: 0;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .topbar .right { display: flex; justify-content: flex-end; gap: 8px; }
  .points { display: flex; align-items: baseline; gap: 5px; }
  .points-value { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 5vw, 28px); font-variant-numeric: tabular-nums; line-height: 1; color: var(--text); transition: color 200ms ease; }
  .points-label { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .points.risk .points-value { color: #2F9E44; }
  .points.low .points-value { color: #B8382A; }
  .points.hit .points-value { animation: pointsHit 500ms ease; }
  @keyframes pointsHit { 30% { transform: scale(1.2); color: #B8382A; } }
  .stake { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: color-mix(in srgb, #B8382A 14%, transparent); color: #B8382A; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }
  .stake-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; }
  .card.modes { gap: 12px; width: min(100%, 420px); }
  .card.modes h2 { margin-bottom: 4px; }
  .mode-btn {
    width: 100%;
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
    text-align: left;
    padding: 14px 16px;
    border-radius: 14px;
    border: 2px solid var(--rule);
    background: color-mix(in srgb, var(--ground) 60%, #fff 40%);
    color: var(--text);
    font-family: var(--body);
    cursor: pointer;
    transition: transform 120ms ease, border-color 120ms ease;
  }
  :root[data-theme="dark"] .mode-btn { background: color-mix(in srgb, var(--ground) 70%, #000 30%); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mode-btn { background: color-mix(in srgb, var(--ground) 70%, #000 30%); } }
  .mode-btn:hover { transform: translateY(-1px); border-color: var(--accent); }
  .mode-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .mode-btn.risk { border-color: color-mix(in srgb, #B8382A 45%, var(--rule)); }
  .mode-btn.risk:hover { border-color: #B8382A; }
  .mode-name { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--accent); }
  .mode-btn.risk .mode-name { color: #B8382A; }
  .mode-desc { font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.35; }
  .icon-btn {
    width: 42px; height: 42px;
    border-radius: 12px;
    border: 2px solid var(--rule);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: grid; place-items: center;
    transition: transform 120ms ease, border-color 120ms ease;
  }
  .icon-btn:hover { transform: translateY(-1px); border-color: var(--muted); }
  .icon-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .hint-btn { width: auto; padding: 0 10px 0 8px; gap: 4px; grid-auto-flow: column; }
  .hint-btn .price { font-weight: 800; font-size: 13px; color: #2F9E44; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .hint-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .hint-btn:disabled .price { color: #B8382A; }
  .hint-btn:disabled:hover { transform: none; border-color: var(--rule); }
  #soundBtn .mute { display: none; }
  #soundBtn[aria-pressed="false"] .wave { display: none; }
  #soundBtn[aria-pressed="false"] .mute { display: block; }

  .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0 6px;
  }
  .lives { display: flex; gap: 10px; }
  .life { width: 38px; height: 38px; fill: none; stroke: var(--life); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: stroke 240ms ease, transform 240ms ease, opacity 240ms ease; }
  .life .string { stroke-width: 1.4; }
  .life.empty { stroke: var(--life-empty); transform: scale(0.85) rotate(-12deg); opacity: 0.8; }
  .counts { display: flex; gap: 14px; align-items: baseline; }
  .status .count {
    font-weight: 800;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .status .count.best { color: var(--accent); }
  .status .count.bank { color: #2F9E44; }
  .status .count.bank.paid { animation: payout 700ms ease; }
  @keyframes payout { 30% { transform: scale(1.18); } }
  .card .score { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 8vw, 44px); color: var(--text); line-height: 1; font-variant-numeric: tabular-nums; }
  .card .score small { display: block; font-family: var(--body); font-weight: 800; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .card .newbest { color: var(--accent); font-weight: 800; }

  /* Radio banner: station red on the left, play state in the text. */
  .radio {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    padding: 6px 10px 6px 6px;
    border-radius: 12px;
    border: 2px solid var(--rule);
    border-left: 6px solid #9E1616;
    background: color-mix(in srgb, var(--ground) 70%, #ffffff 30%);
  }
  :root[data-theme="dark"] .radio { background: color-mix(in srgb, var(--ground) 70%, #000 30%); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .radio { background: color-mix(in srgb, var(--ground) 70%, #000 30%); } }
  .radio-btn {
    width: 36px; height: 36px; flex: none;
    border-radius: 50%;
    border: 0;
    background: #9E1616;
    color: #fff;
    cursor: pointer;
    display: grid; place-items: center;
  }
  .radio-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .radio-btn .pause { display: none; }
  .radio[data-state="playing"] .radio-btn .play, .radio[data-state="loading"] .radio-btn .play { display: none; }
  .radio[data-state="playing"] .radio-btn .pause, .radio[data-state="loading"] .radio-btn .pause { display: block; }
  .radio-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .radio-text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; flex: 1; }
  .radio-name { font-family: var(--display); font-weight: 700; font-size: 15px; color: #9E1616; }
  :root[data-theme="dark"] .radio-name { color: #F08A8A; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .radio-name { color: #F08A8A; } }
  .radio-sub { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .radio-sub em { font-style: normal; }
  .radio-link {
    flex: none;
    display: inline-flex; align-items: center; gap: 4px;
    font-weight: 800; font-size: 13px;
    color: #9E1616;
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 999px;
    border: 2px solid color-mix(in srgb, #9E1616 35%, transparent);
  }
  .radio-link:hover { background: color-mix(in srgb, #9E1616 10%, transparent); }
  .radio-link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .radio-link svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  :root[data-theme="dark"] .radio-link { color: #F08A8A; border-color: color-mix(in srgb, #F08A8A 40%, transparent); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .radio-link { color: #F08A8A; border-color: color-mix(in srgb, #F08A8A 40%, transparent); } }
  .radio[data-state="playing"] .radio-sub em { color: #2F9E44; }
  .radio[data-state="error"] .radio-sub em { color: #B8382A; }
  .radio[data-state="playing"] .radio-name::before {
    content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #9E1616; margin-right: 6px; vertical-align: middle;
    animation: onair 1.2s ease-in-out infinite;
  }
  @keyframes onair { 50% { opacity: 0.25; } }

  .stage {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    position: relative;
    padding: 10px 0;
  }
  svg.board {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: manipulation;
  }
  .snake { cursor: pointer; }
  .snake .hit { fill: none; stroke: transparent; stroke-width: 5.5; pointer-events: stroke; stroke-linecap: round; stroke-linejoin: round; }
  .snake .line, .snake .head {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
    transition: stroke 160ms ease;
  }
  @media (hover: hover) {
    .snake:hover .line, .snake:hover .head { stroke: var(--accent); }
  }
  .snake.armed .line, .snake.armed .head { stroke: #E8842A; }
  .snake.hint .line, .snake.hint .head { stroke: var(--accent); animation: blink 500ms ease 3; }
  .snake.hit-shake { animation: jiggle 260ms ease; }
  @keyframes blink { 50% { opacity: 0.25; } }
  @keyframes jiggle {
    0% { transform: translate(0, 0); }
    35% { transform: translate(var(--jx), var(--jy)); }
    100% { transform: translate(0, 0); }
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--overlay);
    opacity: 0;
    pointer-events: none;
    transition: opacity 240ms ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center; padding: 24px;
  }
  .card h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(22px, 6vw, 32px);
    margin: 0;
    color: var(--accent);
    text-wrap: balance;
  }
  .card p { margin: 0; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }

  .btn {
    font-family: var(--display);
    font-weight: 600;
    font-size: 17px;
    padding: 12px 26px;
    border-radius: 999px;
    border: 2px solid var(--btn);
    background: var(--btn);
    color: var(--btn-text);
    cursor: pointer;
    transition: transform 120ms ease;
  }
  .btn.quiet { background: transparent; color: var(--text); border-color: var(--rule); font-family: var(--body); font-weight: 800; font-size: 14px; padding: 9px 18px; }
  .btn:hover { transform: translateY(-1px); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .footer { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

  /* Touch screens: fatter tap targets, no hover states. */
  :root.mobile .snake .hit, :root.touch .snake .hit { stroke-width: 8.5; }
  :root.touch .icon-btn:hover, :root.touch .btn:hover { transform: none; }

  /* Phones: tighter chrome so the board gets the height. */
  @media (max-width: 600px) {
    .app { padding-left: 10px; padding-right: 10px; }
    .topbar { padding: 10px 0 8px; }
    .topbar h1 { font-size: 20px; }
    .points-value { font-size: 20px; }
    .points-label { display: none; }
    .icon-btn { width: 36px; height: 36px; }
    .hint-btn { width: auto; padding: 0 8px 0 6px; }
    .hint-btn .price { font-size: 12px; }
    .icon-btn svg { width: 20px; height: 20px; }
    .status { padding: 8px 0 0; }
    .counts { gap: 10px; }
    .status .count { font-size: 12px; }
    .lives { gap: 6px; }
    .life { width: 30px; height: 30px; }
    .stage { padding: 6px 0; }
    .radio { margin-top: 6px; padding: 4px 8px 4px 4px; gap: 8px; }
    .radio-btn { width: 32px; height: 32px; }
    .radio-link { padding: 4px 8px; font-size: 12px; }
    .btn.quiet { padding: 7px 12px; font-size: 13px; }
    .card { padding: 16px; }
  }
  /* Phone held sideways: put the controls beside the board instead of under it. */
  @media (max-width: 900px) and (max-height: 500px) {
    .app { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr; column-gap: 12px; }
    .topbar { grid-column: 1 / -1; padding: 6px 0; }
    .status { grid-column: 2; flex-direction: column; align-items: flex-end; justify-content: flex-start; gap: 10px; padding: 8px 0 0; }
    .counts { flex-direction: column; align-items: flex-end; gap: 4px; }
    .stage { grid-column: 1; grid-row: 2 / 5; padding: 4px 0; }
    .radio { grid-column: 2; margin-top: 0; }
    .footer { grid-column: 2; flex-direction: column; align-items: stretch; align-self: end; }
  }

  @media (prefers-reduced-motion: reduce) {
    .snake.hint .line, .snake.hint .head, .snake.hit-shake { animation-duration: 100ms; }
    .overlay { transition: none; }
  }
</style>

<div class="app">
  <div class="topbar">
    <div class="points" id="pointsWrap" title="Points you'd bank if you finished right now — they tick down with the clock">
      <span class="points-value" id="points">0</span>
      <span class="points-label" id="pointsLabel">pts</span>
    </div>
    <h1 id="title">Level 1</h1>
    <div class="right">
      <button class="icon-btn" id="soundBtn" title="Sound" aria-label="Sound on" aria-pressed="true">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M16 9l5 6M21 9l-5 6"/></svg>
      </button>
      <button class="icon-btn hint-btn" id="hintBtn" title="Hint" aria-label="Hint">
        <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>
        <span class="price" id="hintPrice">$5</span>
      </button>
    </div>
  </div>

  <div class="status">
    <div class="lives" id="lives" aria-label="Bows remaining"></div>
    <div class="stake" id="stake" hidden><span class="stake-label">Next bump</span> <span id="stakeCost">−0</span></div>
    <div class="counts">
      <span class="count"><span id="left">0</span> left</span>
      <span class="count"><span id="clock">0:00</span></span>
      <span class="count best">Best <span id="best">0</span></span>
      <span class="count bank" id="bankWrap" title="Your winnings — every cleared level pays out its score">$<span id="bank">0</span></span>
    </div>
  </div>

  <div class="radio" id="radio" data-state="off">
    <button class="radio-btn" id="radioBtn" aria-label="Play CHIR FM">
      <svg viewBox="0 0 24 24" class="play"><path d="M7 4l13 8-13 8z"/></svg>
      <svg viewBox="0 0 24 24" class="pause"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <div class="radio-text">
      <span class="radio-name">CHIR-FM 107.9</span>
      <span class="radio-sub">Gulf Islands Community Radio · <em id="radioState">Off</em></span>
    </div>
    <a class="radio-link" href="https://www.chir.fm/" target="_blank" rel="noopener" aria-label="Open chir.fm in a new tab">chir.fm <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
    <audio id="radioAudio" preload="none" src="https://stream.aiir.com/iirwxwmjurkuv"></audio>
  </div>

  <div class="stage">
    <svg class="board" id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="overlay show" id="modeOverlay">
      <div class="card modes">
        <h2>Choose your game</h2>
        <button class="mode-btn" data-mode="classic">
          <span class="mode-name">Classic</span>
          <span class="mode-desc">Three bows. A bump costs a bow and 15% of the level's points.</span>
        </button>
        <button class="mode-btn risk" data-mode="risk">
          <span class="mode-name">High stakes</span>
          <span class="mode-desc">No bows. Every bump costs points — and the cost doubles each time. Drop below zero and you're out.</span>
        </button>
      </div>
    </div>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="cardTitle">Level cleared</h2>
        <div class="score" id="cardScore" hidden></div>
        <p id="cardText"></p>
        <button class="btn" id="cardBtn">Next level</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="btn quiet" id="retryBtn">Restart level</button>
    <button class="btn quiet" id="newBtn">New puzzle</button>
    <button class="btn quiet" id="skipBtn">Skip level</button>
    <button class="btn quiet" id="modeBtn">Mode</button>
  </div>
</div>

<script>
(() => {
  const DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]]; // up, right, down, left as [dr, dc]
  const U = 10;          // svg units per cell
  const PAD = 1;         // cells of breathing room around the grid
  const SPEED = 18;      // cells per second while sliding
  const MAX_DROPS = 3;

  const $ = (id) => document.getElementById(id);
  const board = $("board"), overlay = $("overlay");
  const rand = (k) => Math.floor(Math.random() * k);
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const key = (r, c) => r * 1000 + c;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Phones and tablets: coarse pointer or a mobile user agent. Drives the touch styling above.
  const isTouch = matchMedia("(pointer: coarse)").matches || navigator.maxTouchPoints > 1;
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (isTouch && Math.min(screen.width, screen.height) < 900);
  document.documentElement.classList.toggle("touch", isTouch);
  document.documentElement.classList.toggle("mobile", isMobile);

  let level = 1;
  try { level = Math.max(1, parseInt(localStorage.getItem("runway-level"), 10) || 1); } catch (e) {}

  // ---------- Generation ----------

  function levelParams(L) {
    const W = Math.min(22, 12 + Math.floor((L - 1) / 2));
    const H = Math.min(28, Math.round(W * 1.25));
    return { W, H, region: Math.round(W * H * 0.78), maxLen: Math.min(7, 3 + Math.floor((L - 1) / 4)) };
  }

  // An organic blob of cells the puzzle will live in, grown from the centre.
  function makeRegion(W, H, target) {
    const inR = Array.from({ length: H }, () => Array(W).fill(false));
    const list = [[Math.floor(H / 2), Math.floor(W / 2)]];
    inR[list[0][0]][list[0][1]] = true;
    let guard = 0;
    while (list.length < target && guard++ < 100000) {
      // Mostly extend from recently added cells so the blob grows lobes instead of a disc.

          if (inb(nr, nc) && inR[nr][nc] && occ[nr][nc] < 0) opts.push(d);
        }
        if (!opts.length) break;
        const nd = (lastDir >= 0 && opts.includes(lastDir) && Math.random() < 0.5) ? lastDir : opts[rand(opts.length)];

        else continue;
        occ[r][c] = occ[nr][nc]; p.cells = [];

    // ---- Stage 2: peel in play order.
    const remaining = new Set();
    paths.forEach((p, i) => { if (p.cells.length) remaining.add(i); });
    const removedAt = Array.from({ length: H }, () => Array(W).fill(-1)); // play step a cell was cleared
    const headDir = Array.from({ length: H }, () => Array(W).fill(-1));   // direction of the head that left from a cell
    const rayOf = (r, c, d) => {
      const out = [];
      for (let rr = r + DIRS[d][0], cc = c + DIRS[d][1]; inb(rr, cc); rr += DIRS[d][0], cc += DIRS[d][1]) out.push([rr, cc]);

    // `b` is the step it became clear (-1 = clear from the start); `train` means the path

    const grade = (r, c, d) => {

    const ends = (p) => [[p.cells[0], 0], [p.cells[p.cells.length - 1], 1]];
    const result = [];
    for (let t = 0; remaining.size; t++) {
      const cands = [];
      for (const id of remaining) for (const [[r, c], end] of ends(paths[id])) for (let d = 0; d < 4; d++) {

      cands.sort((x, y) => (y.b - y.train * 2 - (x.b - x.train * 2)) || (x.train - y.train) || (paths[y.id].cells.length - paths[x.id].cells.length));

      const top = cands.slice(0, 6);

        for (const [a, e] of p.cells) occ[a][e] = -1;

        for (const id of remaining) {
          if (id === cand.id) continue;

          for (const [[r, c]] of ends(paths[id])) for (let d = 0; d < 4 && !any; d++) {
            const ray = rayOf(r, c, d);
            if (ray.every(([a, e]) => occ[a][e] < 0) && ray.some(([a, e]) => p.cells.some(([x, y]) => x === a && y === e))) any = true;
          }
          if (any) opened++;
        }
        for (const [a, e] of p.cells) occ[a][e] = cand.id;
        cand.opened = opened;
      }
      top.sort((x, y) => (y.b - y.train * 2 - (x.b - x.train * 2)) || (x.train - y.train) || ((x.opened === 0) - (y.opened === 0)) || (x.opened - y.opened));
      const pick = top[0];
      const p = paths[pick.id];
      const body = pick.end === 1 ? p.cells : p.cells.slice().reverse(); // tail → head
      for (const [a, e] of body) { occ[a][e] = -1; removedAt[a][e] = t; }
      headDir[pick.r][pick.c] = pick.d;
      remaining.delete(pick.id);
      result.push({ cells: body, d: pick.d, b: pick.b, train: pick.train });
    }

    // Ids run in placement order (first placed = last to leave), matching play-time scans.
    const snakes = result.reverse().map((s, id) => ({ id, cells: s.cells, d: s.d }));
    return { W, H, gaps: 0, open: result.filter((s) => s.b < 0).length, trains: result.filter((s) => s.train).length, snakes };
  }

  // ---------- Sound ----------
  // Two short synthesised effects: a swish for a path leaving, a thunk for a collision.
  let audio = null, soundOn = true;
  try { soundOn = localStorage.getItem("runway-sound") !== "off"; } catch (e) {}
  function ctx() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();

    return buf;
  }

    // Air rushing past: a resonant low-pass that sweeps up through the noise and back down.
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 3;
    lp.frequency.setValueAtTime(300, t);

    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.frequency.setValueAtTime(160, t); osc.frequency.exponentialRampToValueAtTime(48, t + 0.13);
    const og = ac.createGain();
    og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.6, t + 0.008); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

    [N.C4, 0, 0.16], [N.E4, 0.15, 0.16], [N.G4, 0.3, 0.16], [N.C5, 0.45, 0.16], [N.E5, 0.6, 0.16], [N.G5, 0.75, 0.2],
    [N.C5, 1.0, 1.4], [N.E5, 1.0, 1.4], [N.G5, 1.0, 1.4], [N.C6, 1.0, 1.4],
  ], "triangle", 0.28);

  ], "sawtooth", 0.14);

  const soundBtn = $("soundBtn");

  soundBtn.addEventListener("click", () => {

  // ---------- Radio ----------
  // CHIR-FM's live stream (the same address the station's own web player uses). It starts
  // as soon as the page opens; where the browser refuses sound before a tap, it starts on
  // the first move instead. Pausing it holds for this visit only.
  const STREAM = "https://stream.aiir.com/iirwxwmjurkuv";
  const radio = $("radio"), radioAudio = $("radioAudio"), radioState = $("radioState");
  let radioWanted = true, radioWatch = 0, radioAttempt = 0;
  const setRadio = (state, text) => { radio.dataset.state = state; radioState.textContent = text; $("radioBtn").setAttribute("aria-label", state === "playing" || state === "loading" ? "Pause CHIR FM" : "Play CHIR FM"); };

  const elapsed = () => (startedAt ? (performance.now() - startedAt) / 1000 : 0);

    $("title").textContent = "Level " + level;
    $("left").textContent = remaining;
    $("best").textContent = best ? best.score : 0;
    $("bank").textContent = money(bank);
    updateHintBtn();
    showPoints();
    $("lives").hidden = mode === "risk";
    $("stake").hidden = mode !== "risk";
    if (mode === "risk") $("stakeCost").textContent = "−" + money(bumpCost(riskBumps));
    $("best").title = best ? `Level ${best.level}: ${best.arrows} arrows in ${fmtTime(best.seconds)}` : "";
    document.documentElement.dataset.lost = MAX_DROPS - drops;
    const wrap = $("lives");
    wrap.innerHTML = "";
    for (let i = 0; i < MAX_DROPS; i++) {
      const svg = document.createElementNS(board.namespaceURI, "svg");
      svg.setAttribute("viewBox", "0 0 32 32");
      svg.setAttribute("class", "life" + (i < drops ? "" : " empty"));
      // A strung bow with an arrow nocked and ready.
      svg.innerHTML = '<path d="M9 4C21 9 21 23 9 28"/><path class="string" d="M9 4L9 28"/><path d="M5 16H27"/><path d="M22 11l5 5-5 5"/><path d="M5 16l3-3M5 16l3 3"/>';
      wrap.appendChild(svg);
    }
  }

  // Free cells in front of the head, and whether the run reaches the edge.
  function scan(s) {
    const [dr, dc] = DIRS[s.d];
    let [r, c] = s.cells[s.cells.length - 1];
    let free = 0;
    for (r += dr, c += dc; r >= 0 && r < puzzle.H && c >= 0 && c < puzzle.W; r += dr, c += dc) {
      if (occ[r][c] >= 0 && alive[occ[r][c]]) return { clear: false, free, blocker: occ[r][c] };
      free++;
    }
    return { clear: true, free, blocker: -1 };
  }

  // The track a path slides along: its own cells, the run ahead, then off the board.
  function trackOf(s) {
    const [dr, dc] = DIRS[s.d];
    const pts = s.cells.map(toPt);
    let [r, c] = s.cells[s.cells.length - 1];
    for (let i = 0; i < puzzle.W + puzzle.H + s.cells.length + PAD + 2; i++) { r += dr; c += dc; pts.push(toPt([r, c])); }
    return pts;
  }
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  function pointAt(track, p) {
    const i = Math.min(track.length - 2, Math.max(0, Math.floor(p)));
    return lerp(track[i], track[i + 1], p - i);
  }
  function windowPts(track, offset, len) {
    const a = offset, b = offset + len - 1;
    const pts = [pointAt(track, a)];
    for (let i = Math.ceil(a); i <= Math.floor(b); i++) if (i > a && i < b) pts.push(track[i]);
    pts.push(pointAt(track, b));
    return pts;
  }

  // Slide the path's window along its track from `from` to `to` cells, then call done.
  // Animation frames stop entirely while the page is hidden (another app or tab in front),
  // so a timer guarantees every slide lands on its final position and reports done.
  function slide(s, track, from, to, ms, ease, onFrame, done) {
    const g = els[s.id], t0 = performance.now(), dur = reduced ? Math.min(ms, 80) : ms;
    let finished = false;
    const step = (t) => {
      const off = from + (to - from) * ease(t);
      drawSnake(g, windowPts(track, off, s.cells.length), s.d);
      if (onFrame) onFrame(off);
    };
    const finish = () => { if (finished) return; finished = true; step(1); done(); };
    const frame = (now) => {
      if (finished) return;
      const t = document.hidden ? 1 : Math.min(1, (now - t0) / dur);
      if (t >= 1) return finish();
      step(t);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
    setTimeout(finish, dur + 60);
  }
  const easeIn = (t) => t * t, easeOut = (t) => 1 - (1 - t) * (1 - t), linear = (t) => t;

  // Slide a path off the board. Its cells are freed at once so other paths can use the
  // space while it departs; any armed path whose run that opens up follows on its own.
  function depart(id, free) {
    const s = puzzle.snakes[id], g = els[id], track = trackOf(s);
    animating.add(id);
    alive[id] = false;
    armed.delete(id);
    for (const [r, c] of s.cells) occ[r][c] = -1;
    remaining--;
    updateHud();
    g.style.pointerEvents = "none";
    swish(s.cells.length);
    const exitAt = free + 1;                       // head has left the grid
    const end = exitAt + s.cells.length + PAD;     // tail has left too
    slide(s, track, 0, end, (end / SPEED) * 1000, linear,
      (off) => { g.style.opacity = off <= exitAt ? 1 : Math.max(0, 1 - (off - exitAt) / (end - exitAt)); },
      () => { g.remove(); animating.delete(id); if (remaining === 0 && !over) finish(true); });
    releaseArmed();
  }

  // Armed paths (orange, from an earlier collision) leave by themselves once their run is
  // clear — staggered slightly so a chain of them reads as a sequence.
  function releaseArmed() {
    let delay = 140;
    for (const id of [...armed]) {
      if (over || !alive[id] || animating.has(id)) continue;
      const r = scan(puzzle.snakes[id]);
      if (!r.clear) continue;
      armed.delete(id);
      animating.add(id); // reserve it so a tap in the meantime can't double-fire
      setTimeout(() => { animating.delete(id); if (alive[id]) depart(id, scan(puzzle.snakes[id]).free); }, delay);
      delay += 140;
    }
  }

  function tap(id) {
    const s = puzzle.snakes[id];
    if (over || !alive[id] || animating.has(id)) return;
    startClock();
    const g = els[id];
    const { clear, free, blocker } = scan(s);

    if (clear) {
      depart(id, free);
    } else {
      // Run into the blocker, knock it, then slide back home — and stay armed in orange,
      // ready to leave on its own once the way is clear.
      const track = trackOf(s);
      animating.add(id);
      if (mode === "risk") {
        riskPenalty += bumpCost(riskBumps); riskBumps++;
        drops = Math.max(0, MAX_DROPS - riskBumps); // only drives the red background here
        const w = $("pointsWrap"); w.classList.remove("hit"); void w.offsetWidth; w.classList.add("hit");
      } else {
        drops--;
      }
      updateHud();
      armed.add(id);
      g.classList.add("armed");
      const reach = free + 0.35;
      slide(s, track, 0, reach, Math.max(110, (reach / SPEED) * 1000), easeIn, null, () => {
        thunk();
        const b = els[blocker];
        if (b) {
          b.style.setProperty("--jx", DIRS[s.d][1] * 1.4 + "px");
          b.style.setProperty("--jy", DIRS[s.d][0] * 1.4 + "px");
          b.classList.remove("hit-shake"); void b.getBBox(); b.classList.add("hit-shake");
        }
        slide(s, track, reach, 0, 260, easeOut, null, () => {
          animating.delete(id);
          const busted = mode === "risk" ? livePoints() < 0 : drops === 0;
          if (busted) finish(false); else releaseArmed();
        });
      });
    }
  }

  function finish(won) {
    over = true;
    stopClock();
    updateHintBtn();
    if (won) winTune(); else loseTune();
    $("cardTitle").textContent = won ? `Level ${level} cleared` : (mode === "risk" ? "Bankrupt" : "Out of bows");
    const scoreEl = $("cardScore");
    scoreEl.hidden = !won;
    if (won) {
      const bumps = mode === "risk" ? riskBumps : MAX_DROPS - drops;
      const arrows = puzzle.snakes.length, seconds = elapsed();
      const score = Math.max(0, mode === "risk" ? livePoints() : Math.round(livePoints() * (1 - BUMP_PENALTY * bumps)));
      showPoints();
      const isBest = !best || score > best.score;
      if (isBest) {
        best = { score, level, arrows, seconds: Math.round(seconds) };
        try { localStorage.setItem("runway-best", JSON.stringify(best)); } catch (e) {}
      }
      bank += score;
      try { localStorage.setItem("runway-bank", String(bank)); } catch (e) {}
      scoreEl.innerHTML = `+$${money(score)}<small>${isBest ? '<span class="newbest">New best score</span> · ' : "best " + best.score + " · "}you have $${money(bank)}</small>`;
      updateHud();
      const bw = $("bankWrap"); bw.classList.remove("paid"); void bw.offsetWidth; bw.classList.add("paid");
      const bumpNote = !bumps ? " · no bumps"
        : mode === "risk" ? ` · ${bumps} ${bumps === 1 ? "bump" : "bumps"} cost ${money(riskPenalty)}`
        : ` · ${bumps} ${bumps === 1 ? "bump" : "bumps"} (−${Math.round(BUMP_PENALTY * bumps * 100)}%)`;
      $("cardText").textContent = `${arrows} arrows in ${fmtTime(seconds)}` + bumpNote;
    } else {
      $("cardText").textContent = mode === "risk"
        ? `${riskBumps} bumps cost ${money(riskPenalty)} points — the counter went below zero.`
        : `${remaining} ${remaining === 1 ? "path" : "paths"} still on the board.`;
    }
    $("cardBtn").textContent = won ? "Next level" : "Try again";
    $("cardBtn").onclick = won ? () => { level++; startLevel(); } : restartLevel;
    overlay.classList.add("show");
    $("cardBtn").focus();
  }

  function hint() {
    if (over) return;
    const price = hintPrice();
    if (bank < price) { updateHintBtn(); return; }
    const clear = puzzle.snakes.filter((s) => alive[s.id] && !animating.has(s.id) && scan(s).clear);
    if (!clear.length) return;
    bank -= price; hintsUsed++;
    try { localStorage.setItem("runway-bank", String(bank)); } catch (e) {}
    updateHud();
    const g = els[clear[rand(clear.length)].id];
    g.classList.remove("hint"); void g.getBBox(); g.classList.add("hint");
    setTimeout(() => g.classList.remove("hint"), 1600);
  }

  $("hintBtn").addEventListener("click", hint);
  $("retryBtn").addEventListener("click", restartLevel);
  const modeOverlay = $("modeOverlay");
  for (const btn of document.querySelectorAll(".mode-btn")) btn.addEventListener("click", () => {
    const chosen = btn.dataset.mode;
    modeOverlay.classList.remove("show");
    if (chosen !== mode || startedAt) { mode = chosen; restartLevel(); } else { mode = chosen; updateHud(); }
    try { localStorage.setItem("runway-mode", mode); } catch (e) {}
  });
  $("modeBtn").addEventListener("click", () => { if (!over) modeOverlay.classList.add("show"); });
  $("newBtn").addEventListener("click", startLevel);
  $("skipBtn").addEventListener("click", () => { level++; startLevel(); });

  startLevel();
})();
</script>
